<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreBoard</title>
</head>
<style>
    body{
        padding: 0;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .flex_container{
        margin: 100px;
        border: solid 2px;
        width: 750px;
        height: 700px;
    }
    .bar{
        display: flex;
        justify-content: space-between;
    }
    .result{
        display: flex;
        justify-content: space-between;
    }
</style>
<body>
    <div class="flex_container">
        <h2 style="text-align: center;">ScoreBoard</h2>
        <div class="bar">
            <p>Rank</p>
            <p>Name</p>
            <p>Score</p>
            <p>time</p>
        </div>
        <div class="result">
            <p>1st</p>
            <p>Kendi</p>
            <p>Score</p>
            <p>Time</p>
        </div>
    </div>
</body>
</html>
